name: Windows dedicated server

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: 4.7.2

# Releases hold the zip: their files do not count against the Actions
# storage quota that artifacts fill up.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stock editor + official templates (no custom engine): Windows only.
      - name: Install Godot + Windows export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q -j templates.tpz 'templates/windows_release_x86_64*' 'templates/version.txt' -d "$tpl"
          ls -la "$tpl"
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      # Same data as the iOS build, so the bundled mods (and their digest) match.
      - name: Minify JSON data
        run: python3 .github/engine/minify_json.py project

      - name: Import + export Windows server
        working-directory: project
        run: |
          mkdir -p ../build/server
          "$GODOT" --headless --import
          "$GODOT" --headless --export-release "Windows Server" ../build/server/PokeWilds.exe
          ls -la ../build/server

      # Only a server that a client could join and that saved becomes a release.
      - name: Server smoke test
        run: timeout 1800 python3 server/smoke_test.py "$GODOT"

      - name: Package zip
        run: |
          cd build/server
          cp ../../README_SERVER.md ../../server/start_server.bat ../../server/server_launcher.ps1 ../../server/server.cfg.example .
          zip -9 ../../PokeWilds-Server-win64.zip PokeWilds.exe PokeWilds.console.exe PokeWilds.pck \
            README_SERVER.md start_server.bat server_launcher.ps1 server.cfg.example
          ls -la ../../PokeWilds-Server-win64.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="server-build-${{ github.run_number }}"
          git log -1 --pretty=%B > notes.md
          echo "" >> notes.md
          echo "Server dedicato Windows: estrai lo zip e fai doppio clic su start_server.bat (opzioni: --port N --world NOME --size S). Istruzioni in README_SERVER.md." >> notes.md
          gh release create "$tag" PokeWilds-Server-win64.zip \
            --target "$GITHUB_SHA" --title "PokeWilds dedicated server build ${{ github.run_number }}" --notes-file notes.md
          # Keep the five newest builds.
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^server-build-' | tail -n +6 \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
