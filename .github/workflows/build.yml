name: PokeWilds build

# One release per commit with both files: the iPhone IPA and the Windows server
# zip. It starts as a draft (nobody sees it), each build uploads its file, and
# it is published as "Latest" only when both builds passed; otherwise the draft
# is deleted. So releases/latest/download/<file> always gives a matching pair.
on:
  workflow_dispatch:
    inputs:
      fallback:
        description: "Skip the macOS job and build the IPA with the xtool fallback (to test it)"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
  # Pull requests build and test the server, but publish nothing.
  pull_request:
    branches: [main]

env:
  GODOT_VERSION: 4.7.2
  # Stripped engine profile shared by the iOS template and the Linux smoke test.
  ENGINE_PROFILE: ${{ github.workspace }}/.github/engine/custom.py

# Releases hold the files: they do not count against the Actions storage quota
# that artifacts fill up.
permissions:
  contents: write

jobs:
  draft:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.names.outputs.tag }}
      version: ${{ steps.names.outputs.version }}
      bundle: ${{ steps.names.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Zero-padded: GitHub lists releases by tag name, so build-0010 must come
      # after build-0009. The IPA's visible version is MAJOR.MINOR from the iOS
      # preset's short_version plus the commit count (0.10.0 -> 0.10.<n>); raise
      # MAJOR.MINOR there by hand for bigger steps. Its internal version
      # (CFBundleVersion) is the commit count too. Counting commits, not runs,
      # gives a local build of the same commit (tools/ios_xtool) the same version.
      - id: names
        run: |
          base=$(sed -n 's/^application\/short_version="\([0-9]*\.[0-9]*\).*/\1/p' project/export_presets.cfg)
          test -n "$base"
          count=$(git rev-list --count HEAD)
          echo "tag=build-$(printf '%04d' "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"
          echo "version=$base.$count" >> "$GITHUB_OUTPUT"
          echo "bundle=$count" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        env:
          TAG: ${{ steps.names.outputs.tag }}
          VERSION: ${{ steps.names.outputs.version }}
          BUNDLE: ${{ steps.names.outputs.bundle }}
        run: |
          git log -1 --pretty=%B > notes.md
          echo "" >> notes.md
          echo "IPA version $VERSION ($BUNDLE). IPA and server built from ${GITHUB_SHA::8}: they play together (a host refuses players of another build)." >> notes.md
          echo "- **Pokewilds-unsigned.ipa**: sign it with Feather (or similar) before installing." >> notes.md
          echo "- **PokeWilds-Server-win64.zip**: unzip it and run start_server.bat. Guide: README_SERVER.md." >> notes.md
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "PokeWilds $VERSION" --notes-file notes.md

  # Same engine profile on Linux (headless), run against the iOS pack: catches a
  # class or module the game needs but the profile dropped before it hits a phone.
  smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_VERSION }}-stable
          path: godot-src

      - name: Install Godot editor and SCons
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/scons" && "$RUNNER_TEMP/scons/bin/pip" -q install scons

      - uses: actions/cache@v4
        with:
          path: ~/.scons_cache
          # The engine source is a fixed tag: one cache per build profile is enough.
          key: scons-linux-${{ env.GODOT_VERSION }}-${{ hashFiles('.github/engine/custom.py') }}

      - name: Build stripped engine (Linux, headless only)
        working-directory: godot-src
        run: |
          "$RUNNER_TEMP/scons/bin/scons" platform=linuxbsd target=template_release profile="$ENGINE_PROFILE" \
            disable_path_overrides=no \
            x11=no wayland=no alsa=no pulseaudio=no dbus=no speechd=no fontconfig=no udev=no \
            cache_path="$HOME/.scons_cache" -j"$(nproc)"

      - name: Minify JSON data
        run: python3 .github/engine/minify_json.py project

      # Godot's import cache (.godot): only assets that changed since are imported again.
      - uses: actions/cache@v4
        with:
          path: project/.godot
          key: godot-import-smoke-${{ env.GODOT_VERSION }}-${{ hashFiles('project/assets/**/*.import') }}
          restore-keys: godot-import-smoke-${{ env.GODOT_VERSION }}-

      - name: Export the iOS pack
        working-directory: project
        run: |
          "$GODOT" --headless --import
          "$GODOT" --headless --export-pack "iOS" "$RUNNER_TEMP/game.pck"

      - name: Load every script/scene, then run the game
        run: |
          engine=godot-src/bin/godot.linuxbsd.template_release.x86_64
          timeout 600 "$engine" --headless --main-pack "$RUNNER_TEMP/game.pck" -s "$PWD/.github/engine/smoke.gd" 2>&1 | tee smoke.log
          timeout 300 "$engine" --headless --main-pack "$RUNNER_TEMP/game.pck" --quit-after 900 2>&1 | tee -a smoke.log || true
          grep -E "ERROR|SMOKE" smoke.log | sort | uniq -c | sed 's/^/::notice::/'
          grep -q "SMOKE: checked [0-9]*, failed 0" smoke.log
          ! grep -E "SMOKE FAIL|SCRIPT ERROR|Parse Error|Cannot get class|Failed to load|not declared in the current scope" smoke.log

  ios:
    # Runs alongside the smoke test (and waits for a Mac meanwhile); publish
    # needs both, so only a pack that passed the smoke test is released.
    needs: draft
    if: ${{ !inputs.fallback }}
    runs-on: macos-26
    env:
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_VERSION }}-stable
          path: godot-src

      - name: Install Godot + export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          tpl="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q -j templates.tpz 'templates/ios.zip' 'templates/version.txt' -d "$tpl"
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          echo "TPL=$tpl" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/scons" && "$RUNNER_TEMP/scons/bin/pip" -q install scons

      - uses: actions/cache@v4
        with:
          path: ~/.scons_cache
          # The engine source is a fixed tag: one cache per build profile is enough.
          key: scons-ios-${{ env.GODOT_VERSION }}-${{ hashFiles('.github/engine/custom.py') }}

      - name: Build stripped engine (iOS arm64)
        working-directory: godot-src
        run: |
          "$RUNNER_TEMP/scons/bin/scons" platform=ios arch=arm64 target=template_release profile="$ENGINE_PROFILE" lto=thin \
            cache_path="$HOME/.scons_cache" -j"$(sysctl -n hw.ncpu)"
          ls -la bin

      - name: Swap engine library into the iOS template
        run: |
          work="$RUNNER_TEMP/ios_template"
          unzip -q "$TPL/ios.zip" -d "$work"
          lib="$work/libgodot.ios.release.xcframework/ios-arm64/libgodot.a"
          test -f "$lib" || { find "$work" -name '*.a'; exit 1; }
          echo "::notice::official engine lib $(du -h "$lib" | cut -f1)"
          cp godot-src/bin/libgodot.ios.template_release.arm64.a "$lib"
          echo "::notice::stripped engine lib $(du -h "$lib" | cut -f1)"
          rm "$TPL/ios.zip" && (cd "$work" && zip -qry "$TPL/ios.zip" .)

      - name: Minify JSON data
        run: python3 .github/engine/minify_json.py project

      # The commit this build comes from: hosts refuse players of another build.
      # The IPA's visible and internal versions go up with every build.
      - name: Stamp build id and IPA version
        env:
          VERSION: ${{ needs.draft.outputs.version }}
          BUNDLE: ${{ needs.draft.outputs.bundle }}
        run: |
          echo "$GITHUB_SHA" > project/build_id.txt
          python3 - <<'EOF'
          import os, re
          path = "project/export_presets.cfg"
          text = open(path, newline="").read()
          text = re.sub(r'(?m)^application/short_version="[^"]*"', 'application/short_version="%s"' % os.environ["VERSION"], text)
          text = re.sub(r'(?m)^application/version="[^"]*"', 'application/version="%s"' % os.environ["BUNDLE"], text)
          open(path, "w", newline="").write(text)
          EOF
          grep -n '^application/short_version=\|^application/version=' project/export_presets.cfg

      # Godot's import cache (.godot): only assets that changed since are imported again.
      - uses: actions/cache@v4
        with:
          path: project/.godot
          key: godot-import-ios-${{ env.GODOT_VERSION }}-${{ hashFiles('project/assets/**/*.import') }}
          restore-keys: godot-import-ios-${{ env.GODOT_VERSION }}-

      - name: Export Xcode project
        working-directory: project
        run: |
          mkdir -p ../build/ios
          "$GODOT" --headless --import
          "$GODOT" --headless --export-release "iOS" ../build/ios/Pokewilds.ipa

      # The engine is LTO bitcode, compiled again at every link (minutes): the
      # linker's cache keeps that work while the engine and Xcode stay the same.
      - id: xcode
        run: echo "version=$(xcodebuild -version | tr -s ' \n' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/lto-cache
          key: ios-lto-${{ steps.xcode.outputs.version }}-${{ env.GODOT_VERSION }}-${{ hashFiles('.github/engine/custom.py') }}

      - name: Build unsigned .app and pack IPA
        working-directory: build/ios
        run: |
          set -o pipefail
          # Surface compiler errors as annotations (readable without log access).
          xcodebuild -project Pokewilds.xcodeproj -scheme Pokewilds -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            OTHER_LDFLAGS='$(inherited) -Wl,-cache_path_lto,'"$HOME/lto-cache" build 2>&1 | tee xb.log \
            || { grep -E -A3 'error[:]|FAILED|ld: |Undefined sym|referenced from|warning: .*(built for|newer)' xb.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | sed 's/^/::error::/'; echo; exit 1; }
          mkdir Payload
          cp -R dd/Build/Products/Release-iphoneos/Pokewilds.app Payload/
          # Drop local/debug symbols from the engine binary; Feather re-signs afterwards.
          xcrun strip -Sx Payload/Pokewilds.app/Pokewilds
          du -sh Payload/Pokewilds.app/* | sed 's/^/::notice::/'
          zip -qry -9 Pokewilds-unsigned.ipa Payload

      - name: Add the IPA to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/ios/Pokewilds-unsigned.ipa

  # When the macOS job did not build the IPA (no runner, a failure, or skipped
  # to test this), build the same IPA on Linux with xtool (tools/ios_xtool):
  # same stripped engine, version and build id. Xcode, which xtool turns into
  # the iOS SDK, comes from the private LucaFagnoni/xcode-sdk release through a
  # read-only token (XCODE_SDK_TOKEN). Never on pull requests.
  ios_xtool:
    needs: [draft, smoke, ios]
    if: ${{ always() && github.event_name != 'pull_request' && needs.draft.result == 'success' && needs.smoke.result == 'success' && needs.ios.result != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Xcode from the private repository
        env:
          GH_TOKEN: ${{ secrets.XCODE_SDK_TOKEN }}
        run: |
          gh release download xcode-27.1 -R LucaFagnoni/xcode-sdk -D "$RUNNER_TEMP/xcode"
          cd "$RUNNER_TEMP/xcode"
          # A release holds the .xip whole, or in pieces when over GitHub's 2 GiB limit.
          if ls *.part* >/dev/null 2>&1; then cat $(ls *.part* | sort) > Xcode.xip && rm -f *.part*; else mv Xcode_*.xip Xcode.xip; fi
          ls -la

      - uses: actions/cache@v4
        with:
          path: ~/pokewilds-ios/cache/engine
          # The stripped iOS engine, rebuilt only when the profile changes.
          key: xtool-engine-4.7.2-${{ hashFiles('.github/engine/custom.py') }}

      # lld's LTO codegen of that engine (see Package.swift): the link takes
      # seconds instead of ~8 minutes. setup.sh pins xtool, which brings lld.
      - uses: actions/cache@v4
        with:
          path: ~/pokewilds-ios/cache/lto
          key: xtool-lto-${{ env.GODOT_VERSION }}-${{ hashFiles('.github/engine/custom.py', 'tools/ios_xtool/setup.sh') }}

      # Godot's import cache (.godot): only assets that changed since are imported again.
      - uses: actions/cache@v4
        with:
          path: ~/pokewilds-ios/project/.godot
          key: godot-import-xtool-${{ env.GODOT_VERSION }}-${{ hashFiles('project/assets/**/*.import') }}
          restore-keys: godot-import-xtool-${{ env.GODOT_VERSION }}-

      - name: Swift, xtool and the iOS SDK
        run: |
          bash tools/ios_xtool/setup.sh "$RUNNER_TEMP/xcode/Xcode.xip"
          rm -rf "$RUNNER_TEMP/xcode"

      # The smoke job already checked this pack with the stripped engine.
      - name: Build the IPA with xtool
        run: SMOKE=0 bash tools/ios_xtool/build_ipa.sh

      - name: Add the IPA to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "$HOME/pokewilds-ios/Pokewilds-unsigned.ipa"
          gh release view "$TAG" --json body --jq .body > notes.md
          echo "" >> notes.md
          echo "IPA built on Linux with xtool (no macOS runner): same engine, version and build id; plain PNG icons and launch screen." >> notes.md
          gh release edit "$TAG" --notes-file notes.md

  server:
    needs: draft
    # On pull requests there is no draft: build and test only.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Stock editor + official templates (no custom engine): Windows only.
      - name: Install Godot + Windows export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q -j templates.tpz 'templates/windows_release_x86_64*' 'templates/version.txt' -d "$tpl"
          ls -la "$tpl"
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      # Same data as the iOS build, so the bundled mods (and their digest) match.
      - name: Minify JSON data
        run: python3 .github/engine/minify_json.py project

      # The commit this build comes from: the server refuses players of another
      # build, which is why both files share one release.
      - name: Stamp build id
        run: echo "$GITHUB_SHA" > project/build_id.txt

      # Godot's import cache (.godot): only assets that changed since are imported again.
      - uses: actions/cache@v4
        with:
          path: project/.godot
          key: godot-import-server-${{ env.GODOT_VERSION }}-${{ hashFiles('project/assets/**/*.import') }}
          restore-keys: godot-import-server-${{ env.GODOT_VERSION }}-

      - name: Import + export Windows server
        working-directory: project
        run: |
          mkdir -p ../build/server
          "$GODOT" --headless --import
          "$GODOT" --headless --export-release "Windows Server" ../build/server/PokeWilds.exe
          ls -la ../build/server

      # Only a server that a client could join and that saved goes into the release.
      - name: Server smoke test
        run: timeout 1800 python3 -u server/smoke_test.py "$GODOT"

      - name: Package zip
        run: |
          cd build/server
          cp ../../README_SERVER.md ../../server/start_server.bat ../../server/server_launcher.ps1 ../../server/server.cfg.example .
          zip -9 ../../PokeWilds-Server-win64.zip PokeWilds.exe PokeWilds.console.exe PokeWilds.pck \
            README_SERVER.md start_server.bat server_launcher.ps1 server.cfg.example
          ls -la ../../PokeWilds-Server-win64.zip

      - name: Add the server to the draft release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" PokeWilds-Server-win64.zip

  publish:
    needs: [draft, smoke, ios, ios_xtool, server]
    # The IPA from macOS or, failing that, from the xtool fallback.
    if: ${{ always() && needs.draft.result == 'success' && needs.smoke.result == 'success' && needs.server.result == 'success' && (needs.ios.result == 'success' || needs.ios_xtool.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - name: Publish the release as Latest
        run: |
          gh release edit "$TAG" --draft=false --latest
          # Keep the ten newest builds.
          gh release list --limit 100 --exclude-drafts --json tagName --jq '.[].tagName' | grep '^build-' | tail -n +11 \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes; done

  # A build that was not published (a job failed, was cancelled or never got a
  # runner) leaves no half release behind. To retry it, use "Re-run all jobs":
  # the draft is made again.
  discard:
    needs: [draft, publish]
    if: ${{ always() && needs.draft.result == 'success' && needs.publish.result != 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - name: Delete the draft release
        run: gh release delete "$TAG" --yes
